<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live transcript</title><link rel="stylesheet" href="/live/style.css"><script type="module" src="/live/app.mjs"></script></head>
<body>
<header><h1>Live transcript</h1><p><strong id="status" role="status">Connecting to local service…</strong> <span id="scroll-status"></span></p><p id="detail"></p>
<nav aria-label="Transcript controls"><button id="follow">Pause auto-scroll</button><button id="copy">Copy transcript</button><button id="clear">Clear transcript</button></nav>
<p id="notice" role="status"></p><p id="retention"></p><p class="privacy">Memory only · No transcript files · New meeting or process restart clears text</p></header>
<main id="transcript" aria-label="Transcript" tabindex="0"><p id="empty">Waiting for transcript…</p></main>
</body></html>
